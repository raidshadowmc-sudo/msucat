[package]
name = "msucat"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["raidshadowmc-sudo"]
description = "Fast, cross-platform CLI and library for searching, inspecting, and downloading from Microsoft Update Catalog"
readme = "README.md"
license = "MIT"
repository = "https://github.com/raidshadowmc-sudo/msucat"
keywords = ["windows-update", "msu", "catalog", "downloader", "kb"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "msucat"
path = "src/lib.rs"

[[bin]]
name = "msucat"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
colored = "3.0"
indicatif = "0.17"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
hex = "0.4"
regex = "1.11"
thiserror = "2.0"
futures-util = "0.3"
